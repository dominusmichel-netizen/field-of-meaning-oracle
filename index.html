<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oracle v2 - HUD</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: monospace; color: #00f2ff; }
        #canvas-container { position: absolute; top:0; left:0; width:100%; height:100%; z-index: 1; }
        #hud { position: absolute; width: 100%; height: 100%; z-index: 10; pointer-events: none; padding: 20px; box-sizing: border-box; }
        .tl { position: absolute; top: 20px; left: 20px; border-left: 2px solid #00f2ff; padding-left: 10px; }
        .br { position: absolute; bottom: 40px; right: 40px; text-align: right; border-right: 2px solid #00f2ff; padding-right: 10px; }
        #alert { position: absolute; top: 100px; right: 20px; color: #ff3333; font-size: 10px; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="hud">
        <div class="tl">SYSTEM: ORACLE V2.1<br>SCANNING: NVIDIA_SN</div>
        <div class="br">DISSONANCE: <span id="ds">0.35</span><br>STATUS: CRITICAL</div>
        <div id="alert"></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, rings = [];
        let dissonance = 0.35;

        async function update() {
            try {
                const r = await fetch('data_snapshot.json');
                const d = await r.json();
                dissonance = d.kpis.dissonancia_mercado;
                document.getElementById('ds').innerText = dissonance.toFixed(2);
            } catch(e) {}
        }

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const mat = new THREE.MeshBasicMaterial({ color: 0x00f2ff, wireframe: true, transparent: true, opacity: 0.6 });
            
            for(let i=0; i<3; i++) {
                const r = new THREE.Mesh(new THREE.TorusGeometry(1.5 - (i*0.4), 0.02, 16, 100), mat);
                r.rotation.x = Math.random() * Math.PI;
                r.rotation.y = Math.random() * Math.PI;
                scene.add(r);
                rings.push(r);
            }

            const core = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), new THREE.MeshBasicMaterial({ color: 0x00f2ff }));
            scene.add(core);

            camera.position.z = 5;
            loop();
            setInterval(update, 5000);
        }

        function loop() {
            requestAnimationFrame(loop);
            rings.forEach((r, i) => {
                r.rotation.z += 0.01 * (i+1);
                r.rotation.x += 0.005;
            });

            if(dissonance > 0.3) {
                scene.position.x = Math.sin(Date.now()*0.1)*0.02;
                if(Math.random() > 0.98) {
                    document.getElementById('alert').innerHTML = "SYSTEM_ERR: " + Math.random().toString(16).slice(2,8) + "<br>" + document.getElementById('alert').innerHTML;
                }
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
