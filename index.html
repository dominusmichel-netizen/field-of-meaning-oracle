<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oracle v2 - Field of Meaning HUD</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: 'Courier New', Courier, monospace; color: #00f2ff; }
        #canvas-container { width: 100vw; height: 100vh; }
        #hud-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; border: 1px solid rgba(0, 242, 255, 0.2);
            box-sizing: border-box; background: radial-gradient(circle, transparent 60%, rgba(0, 20, 30, 0.8) 100%);
        }
        .telemetry {
            position: absolute; padding: 20px; text-transform: uppercase; letter-spacing: 2px;
            font-size: 10px; text-shadow: 0 0 5px #00f2ff;
        }
        .top-left { top: 20px; left: 20px; border-left: 2px solid #00f2ff; }
        .bottom-right { bottom: 20px; right: 20px; text-align: right; border-right: 2px solid #00f2ff; }
        #alert-terminal {
            position: absolute; top: 100px; right: 20px; width: 250px;
            font-size: 9px; color: #ff3333; text-align: left;
            background: rgba(255, 0, 0, 0.05); padding: 10px;
            border-left: 1px solid #ff3333; display: none;
            max-height: 400px; overflow: hidden;
        }
        .glitch-text { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="alert-terminal" id="syntactic-alerts"></div>
    <div id="hud-overlay">
        <div class="telemetry top-left">
            <div>System: Oracle v2.0.4</div>
            <div>Mode: Deep Meaning Analysis</div>
            <div id="status-kpi" class="glitch-text">Scanning: NVIDIA_SN_20260524</div>
        </div>
        <div class="telemetry bottom-right">
            <div>Dissonance Index: <span id="val-dissonance">0.35</span></div>
            <div>Entropy Level: <span id="val-entropy">High</span></div>
            <div>Status: Critical Path Detected</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Adicionando bibliotecas de efeitos avançados -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script>
        let scene, camera, renderer, crystal, composer;
        let points = [];
        let oracleData = { intensidade_tremor: 0, kpis: { dissonancia_mercado: 0 } };

        async function loadOracleData() {
            try {
                const response = await fetch('data_snapshot.json');
                oracleData = await response.json();
                document.getElementById('val-dissonance').innerText = oracleData.kpis.dissonancia_mercado.toFixed(2);
                document.getElementById('val-entropy').innerText = oracleData.morfologia_sugerida;
            } catch (e) {
                console.error("Aguardando dados do Oracle...", e);
            }
        }

        function init() {
            loadOracleData();
            setInterval(loadOracleData, 5000); 
            
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.ReinhardToneMapping;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Efeitos de Bloom (Brilho Neon)
            const renderScene = new THREE.RenderPass(scene, camera);
            const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            bloomPass.threshold = 0;
            bloomPass.strength = 1.2;
            bloomPass.radius = 0.5;

            composer = new THREE.EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            // Interface 3D Aprimorada
            const geometry = new THREE.IcosahedronGeometry(2, 2);
            const material = new THREE.MeshBasicMaterial({
                color: 0x00f2ff,
                wireframe: true,
                transparent: true,
                opacity: 0.8
            });
            crystal = new THREE.Mesh(geometry, material);
            scene.add(crystal);

            // Partículas de Fundo
            const particlesGeometry = new THREE.BufferGeometry();
            const particlesCount = 500;
            const posArray = new Float32Array(particlesCount * 3);
            for(let i=0; i < particlesCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 10;
            }
            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const particlesMaterial = new THREE.PointsMaterial({ size: 0.005, color: 0x00f2ff });
            const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
            scene.add(particlesMesh);

            camera.position.z = 5;
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            
            const tremorScale = oracleData.intensidade_tremor || 0.1;
            crystal.rotation.y += 0.003;
            crystal.rotation.x += 0.001;
            
            if(tremorScale > 0.3) {
                crystal.position.x = Math.sin(Date.now() * 0.05) * (tremorScale * 0.05);
                crystal.position.y = Math.cos(Date.now() * 0.05) * (tremorScale * 0.05);
                showSyntacticError();
            } else {
                document.getElementById('alert-terminal').style.display = 'none';
            }

            const scale = 1 + Math.sin(Date.now() * 0.002) * 0.03;
            crystal.scale.set(scale, scale, scale);

            composer.render();
        }

            const terminal = document.getElementById('alert-terminal');
            terminal.style.display = 'block';
            if(Math.random() > 0.95) {
                const errors = [
                    "ERR 0x404: REALITY_MISMATCH",
                    "KPI_05: DISSONANCE_CRITICAL",
                    "NARRATIVE_DECOUPLING: 88%",
                    "WARNING: ANCHOR_POINT_FAILURE",
                    "QUANTUM_DRIFT_DETECTED",
                    "KERNEL: SEMANTIC_CORRUPTION"
                ];
                const msg = document.createElement('div');
                msg.style.marginBottom = '5px';
                msg.innerText = `[${new Date().toLocaleTimeString()}] ${errors[Math.floor(Math.random()*errors.length)]}`;
                terminal.prepend(msg);
                if(terminal.childNodes.length > 10) terminal.lastChild.remove();
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
